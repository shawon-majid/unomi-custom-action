services:
  elasticsearch:
    image: elasticsearch:7.17.5
    container_name: unomi-test-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - cluster.name=contextElasticSearch
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -E 'green|yellow' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  unomi:
    image: apache/unomi:2.6.0
    container_name: unomi-test-unomi
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - UNOMI_ELASTICSEARCH_ADDRESSES=elasticsearch:9200
      - UNOMI_CLUSTER_PUBLIC_ADDRESS=http://localhost:8181
      - UNOMI_CLUSTER_INTERNAL_ADDRESS=https://unomi:9443
      - UNOMI_THIRDPARTY_PROVIDER1_IPADDRESSES=0.0.0.0/0,::1,127.0.0.1
      - UNOMI_CORS_ALLOWED_ORIGINS=http://localhost:3000
      - UNOMI_HAZELCAST_TCPIP_MEMBERS=
    ports:
      - "8181:8181"
      - "9443:9443"
      - "8102:8102"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  es-data:
