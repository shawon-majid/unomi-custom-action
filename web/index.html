<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unomi tracker test</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        max-width: 640px;
        margin: 4rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      h1 { font-size: 1.25rem; }
      button {
        font: inherit;
        padding: 0.6rem 1rem;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover { opacity: 0.7; }
      .stat {
        display: flex;
        gap: 1rem;
        margin: 1.5rem 0;
        padding: 1rem;
        border: 1px dashed currentColor;
        border-radius: 6px;
      }
      .stat b { font-size: 1.25rem; }
      .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
      pre { white-space: pre-wrap; word-break: break-all; font-size: 0.85rem; opacity: 0.7; }
      .hint { font-size: 0.85rem; opacity: 0.7; }
    </style>
  </head>
  <body>
    <h1>Unomi tracker test</h1>
    <p>Loads the bundled Unomi tracker, fires a <code>view</code> event on load. Each multiple-of-10 view triggers the local webhook.</p>

    <div class="stat">
      <div>profile<br /><b id="profile">…</b></div>
      <div>pageViewCount<br /><b id="count">…</b></div>
    </div>

    <div class="row">
      <button id="fire">Send view event</button>
      <button id="refresh">Refresh count</button>
      <button id="reset" title="Clear cookies and reload (new profile)">New profile</button>
    </div>

    <p class="hint">Tip: the webhook fires at counts 10, 20, 30, …  Watch your <code>bun run server</code> terminal.</p>

    <pre id="log"></pre>

    <script>
      const UNOMI = "http://localhost:8181";
      const SCOPE = "unomi-test";

      const els = {
        profile: document.getElementById("profile"),
        count: document.getElementById("count"),
        log: document.getElementById("log"),
        fire: document.getElementById("fire"),
        refresh: document.getElementById("refresh"),
        reset: document.getElementById("reset"),
      };

      function log(...args) {
        els.log.textContent =
          new Date().toISOString().slice(11, 19) + " " + args.join(" ") + "\n" + els.log.textContent;
      }

      // Persistent local profile/session ids (kept simple — no third-party tracker dependency).
      function uuid() {
        return crypto.randomUUID();
      }
      function getOrSet(key) {
        let v = localStorage.getItem(key);
        if (!v) {
          v = uuid();
          localStorage.setItem(key, v);
        }
        return v;
      }
      let profileId = getOrSet("unomi-test:profileId");
      let sessionId = getOrSet("unomi-test:sessionId");

      async function context(events) {
        const body = {
          source: { itemType: "site", itemId: SCOPE, scope: SCOPE },
          requireSegments: false,
          requiredProfileProperties: ["pageViewCount"],
          sessionId,
          profileId,
          events: events ?? [],
        };
        const res = await fetch(`${UNOMI}/cxs/context.json`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "omit",
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error(`context.json ${res.status}`);
        return res.json();
      }

      function viewEvent() {
        return {
          eventType: "view",
          scope: SCOPE,
          source: { itemType: "site", itemId: SCOPE, scope: SCOPE },
          target: {
            itemType: "page",
            itemId: location.pathname,
            scope: SCOPE,
            properties: { pageInfo: { pageName: document.title, pagePath: location.pathname } },
          },
        };
      }

      async function refresh() {
        try {
          const ctx = await context();
          const count = ctx?.profileProperties?.pageViewCount ?? 0;
          els.profile.textContent = (ctx?.profileId ?? profileId).slice(0, 8) + "…";
          els.count.textContent = String(count);
        } catch (e) {
          log("refresh error", e.message);
        }
      }

      async function fireView() {
        try {
          const ctx = await context([viewEvent()]);
          const count = ctx?.profileProperties?.pageViewCount ?? 0;
          els.profile.textContent = (ctx?.profileId ?? profileId).slice(0, 8) + "…";
          els.count.textContent = String(count);
          log("view sent → count =", count);
        } catch (e) {
          log("view error", e.message);
        }
      }

      els.fire.addEventListener("click", fireView);
      els.refresh.addEventListener("click", refresh);
      els.reset.addEventListener("click", () => {
        localStorage.removeItem("unomi-test:profileId");
        localStorage.removeItem("unomi-test:sessionId");
        location.reload();
      });

      // Auto-track on load.
      fireView();
    </script>
  </body>
</html>
